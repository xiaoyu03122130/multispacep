name: 打包多域 APK

# 两种上传方式都能用：
#   A. 手机网页把「工程 zip」传到仓库根目录 -> 自动解压后构建
#   B. 仓库根目录本身就是工程内容（有 gradlew）-> 直接构建
# 不限分支：手机建仓库时默认分支叫什么都能触发
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解压源码包（手机上传 zip 的场景）
        shell: bash
        run: |
          shopt -s nullglob
          zips=(./*.zip)
          if (( ${#zips[@]} > 0 )); then
            mkdir -p extracted
            unzip -o -q "${zips[0]}" -d extracted
            if [ ! -d extracted/multispace ]; then
              echo "zip 里没找到 multispace/ 工程目录"; exit 1
            fi
            echo "SRC=extracted/multispace" >> "$GITHUB_ENV"
          else
            echo "SRC=." >> "$GITHUB_ENV"
          fi

      - name: 检查源码是否就绪
        id: check
        shell: bash
        run: |
          if [ -f "$SRC/gradlew" ]; then
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
            echo "仓库里还没有工程源码（只创建了 workflow），本次跳过。上传 zip 后会自动再跑一次。"
          fi

      - name: JDK 17
        if: steps.check.outputs.has == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        if: steps.check.outputs.has == '1'
        uses: android-actions/setup-android@v3

      - name: 安装 Platform 35 / Build-Tools 35.0.0
        if: steps.check.outputs.has == '1'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: 构建 debug APK
        if: steps.check.outputs.has == '1'
        run: |
          cd "$SRC"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # debug 包自带 Android 默认 debug 签名，可直接安装，无需 keystore
      - name: 上传 APK
        if: steps.check.outputs.has == '1'
        uses: actions/upload-artifact@v4
        with:
          name: MultiSpace-debug-apk
          path: |
            extracted/multispace/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
